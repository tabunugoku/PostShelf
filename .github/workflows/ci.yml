name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # zip の直下に manifest.json が来るよう dist/ の中身を固める (展開してそのまま chrome://extensions に読み込める)
      - name: Zip dist
        run: cd dist && zip -r ../postshelf-dist.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: postshelf-dist
          path: postshelf-dist.zip
          if-no-files-found: error
