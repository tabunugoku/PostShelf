<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostShelf manager mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<style>
.ps{display:grid;grid-template-columns:200px minmax(0,1fr);border:.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2);max-width:900px}
.side{border-right:.5px solid var(--border);padding:12px 8px;background:var(--surface-1)}
.fr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
.fr:hover{background:var(--fill-ghost-hover)}.fr.on{background:var(--fill-ghost-selected);font-weight:500}
.fr i{font-size:18px}.fr .n{margin-left:auto;font-size:12px;color:var(--text-muted)}
.main{padding:12px 16px;min-height:430px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:flex;border:.5px solid var(--border-strong);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{border:none;border-radius:0;padding:4px 10px;font-size:13px}.seg button.on{background:var(--fill-ghost-selected)}
.post{display:flex;gap:10px;padding:10px 0;border-top:.5px solid var(--border)}
.av{width:36px;height:36px;border-radius:50%;background:var(--fill-control);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
.mini{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:.5px solid var(--border);font-size:13px}
.mini .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit{margin-top:12px;border:.5px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-1)}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw.on{border-color:var(--text-primary)}
.ic{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:18px;border:.5px solid var(--border)}
.ic.on{background:var(--fill-ghost-selected);border-color:var(--border-stronger)}
</style></head><body>
<h1>manager ページ (chrome-extension://.../manager.html)</h1>
<p class="note">外観の基準モック。編集ボタンで編集パネルが開く。色はアイコンが folder のときのみ有効。実装はこれに寄せる (Preact 化)。</p>
<div class="ps">
 <div class="side">
  <div style="font-size:12px;color:var(--text-muted);padding:4px 10px">ブックマーク</div>
  <div id="folders"></div>
  <div class="fr" style="color:var(--text-secondary)" onclick="addF()"><i class="ti ti-plus"></i>新しいフォルダ</div>
 </div>
 <div class="main">
  <div class="bar">
   <i id="hi" class="ti" style="font-size:22px"></i>
   <span id="hn" style="font-size:18px;font-weight:500"></span>
   <button onclick="toggleEdit()" aria-label="編集" style="padding:2px 8px"><i class="ti ti-edit"></i></button>
   <div class="seg"><button id="v1" class="on" onclick="setV('post')">ポスト表示</button><button id="v2" onclick="setV('list')">リスト表示</button></div>
  </div>
  <div id="posts"></div>
  <div class="edit" id="edit" style="display:none">
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span style="font-size:13px;color:var(--text-secondary);width:48px">名前</span><input id="nm" style="flex:1" oninput="rename(this.value)"></div>
   <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span style="font-size:13px;color:var(--text-secondary);width:48px">アイコン</span><span id="icons"></span></div>
   <div id="colrow" style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--text-secondary);width:48px">色</span><span id="cols" style="display:flex;gap:8px"></span></div>
  </div>
 </div>
</div>
<script>
var COL=['#E24B4A','#BA7517','#639922','#1D9E75','#378ADD','#7F77DD','#D4537E','#888780'];
var ICONS=['ti-folder','ti-star','ti-code','ti-book','ti-bulb','ti-heart','ti-photo','ti-briefcase'];
var F=[{n:'すべて',i:'ti-bookmarks',c:null,fixed:1},{n:'開発ネタ',i:'ti-code',c:'#378ADD'},{n:'あとで読む',i:'ti-book',c:'#BA7517'},{n:'デザイン',i:'ti-folder',c:'#D4537E'}];
var P=[[1,'AI','Chrome拡張のmanifest v3でservice workerを長持ちさせる小技まとめ','@devtips'],[2,'MH','長文スレッド: 個人開発で3年続けて学んだこと','@maho'],[3,'UI','余白とタイポグラフィだけで画面が締まる理由','@uidaily'],[1,'JS','IndexedDBを薄くラップするだけで十分だった話','@jsnotes'],[2,'RD','週末に読む論文リスト 2026年秋','@readlist'],[3,'CL','アイコンを統一するとブランドが育つ','@colorlab']];
var cur=1,view='post',ed=false;
function render(){
 var h='';F.forEach(function(f,k){h+='<div class="fr'+(k==cur?' on':'')+'" onclick="sel('+k+')"><i class="ti '+f.i+'" style="'+(f.c?'color:'+f.c:'')+'"></i>'+f.n+'<span class="n">'+cnt(k)+'</span></div>'});
 document.getElementById('folders').innerHTML=h;
 var f=F[cur];var hi=document.getElementById('hi');hi.className='ti '+f.i;hi.style.color=f.c||'var(--text-primary)';
 document.getElementById('hn').textContent=f.n;
 var items=P.filter(function(p){return cur==0||p[0]==cur});var o='';
 items.forEach(function(p){
  if(view=='post')o+='<div class="post"><div class="av">'+p[1]+'</div><div><div style="font-weight:500">'+p[3]+' <span style="font-weight:400;color:var(--text-muted)">· 2h</span></div><div style="line-height:1.5">'+p[2]+'</div><div style="display:flex;gap:18px;margin-top:6px;color:var(--text-muted);font-size:13px"><span><i class="ti ti-message-circle"></i> 12</span><span><i class="ti ti-repeat"></i> 34</span><span><i class="ti ti-heart"></i> 210</span><span style="color:'+(F[p[0]].c||'')+'"><i class="ti '+F[p[0]].i+'"></i> '+F[p[0]].n+'</span></div></div></div>';
  else o+='<div class="mini"><i class="ti '+F[p[0]].i+'" style="color:'+(F[p[0]].c||'')+'"></i><span style="color:var(--text-secondary);width:70px">'+p[3]+'</span><span class="t">'+p[2]+'</span><i class="ti ti-external-link" style="color:var(--text-muted)"></i></div>';
 });
 document.getElementById('posts').innerHTML=o;
 document.getElementById('nm').value=f.n;document.getElementById('nm').disabled=!!f.fixed;
 document.getElementById('icons').innerHTML=ICONS.map(function(i){return '<span class="ic'+(f.i==i?' on':'')+'" onclick="setI(\''+i+'\')"><i class="ti '+i+'"></i></span>'}).join('');
 document.getElementById('cols').innerHTML=COL.map(function(c){return '<span class="sw'+(f.c==c?' on':'')+'" style="background:'+c+'" onclick="setC(\''+c+'\')"></span>'}).join('');
 document.getElementById('colrow').style.opacity=f.i=='ti-folder'?1:0.45;
 document.getElementById('v1').className=view=='post'?'on':'';document.getElementById('v2').className=view=='list'?'on':'';
 document.getElementById('edit').style.display=ed&&!f.fixed?'block':'none';
}
function cnt(k){return P.filter(function(p){return k==0||p[0]==k}).length}
function sel(k){cur=k;render()}
function setV(v){view=v;render()}
function toggleEdit(){ed=!ed;render()}
function setI(i){F[cur].i=i;render()}
function setC(c){F[cur].c=c;render()}
function rename(v){F[cur].n=v;render2()}
function render2(){var a=document.activeElement;render();if(a&&a.id=='nm')document.getElementById('nm').focus()}
function addF(){F.push({n:'新しいフォルダ',i:'ti-folder',c:'#1D9E75'});cur=F.length-1;ed=true;render()}
render();
</script></body></html>
