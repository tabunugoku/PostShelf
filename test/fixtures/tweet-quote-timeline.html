<!-- タイムラインでは、本体の time が上にあり、引用の time は後ろにあると想定する。
     引用の入れ物 div[role="link"] は詳細ページの実機値に合わせた推測。すべて架空のデータ。 -->
<article data-testid="tweet">
  <div data-testid="Tweet-User-Avatar"><img src="https://pbs.twimg.com/profile_images/sample_main/avatar.jpg"></div>
  <div data-testid="User-Name"><span>Sample Main</span><span>@sample_main</span>
    <a href="/sample_main/status/111"><time datetime="2026-10-02T12:00:00.000Z">main date</time></a>
  </div>
  <div data-testid="tweetText">本体の架空の全文です。</div>
  <div data-testid="tweetPhoto"><img src="https://pbs.twimg.com/media/sample_main.jpg"></div>
  <div role="link">
    <div data-testid="Tweet-User-Avatar"><img src="https://pbs.twimg.com/profile_images/sample_quote/avatar.jpg"></div>
    <div data-testid="User-Name"><span>Sample Quote</span><span>@sample_quote</span>
      <a href="/sample_quote/status/222"><time datetime="2026-10-01T10:00:00.000Z">quoted date</time></a>
    </div>
    <div data-testid="tweetText">引用の架空の本文。<a href="https://example.com/sample">sample link</a></div>
    <div data-testid="tweetPhoto"><img src="https://pbs.twimg.com/media/sample_quote.jpg"></div>
    <div data-testid="videoPlayer"><video poster="https://pbs.twimg.com/media/sample_quote_video.jpg"></video></div>
    <div data-testid="card.wrapper">架空の引用カード</div>
    <a data-testid="tweet-text-show-more-link" href="/sample_quote/status/222">quoted more</a>
  </div>
  <div role="group"><button data-testid="bookmark"></button></div>
</article>
